{% extends "base.html" %}
{% block content %}
  <h2>Edit Passenger</h2>

  <form action="/update_passenger/{{ passenger[0] }}" method="POST" class="row g-3">
    <div class="col-md-6">
      <label for="fullName" class="form-label">Full Name</label>
      <input type="text" name="fullName" class="form-control" value="{{ passenger[1] }}" required>
    </div>
    <div class="col-md-6">
      <label for="email" class="form-label">Email</label>
      <input type="email" name="email" class="form-control" value="{{ passenger[2] }}" required>
    </div>
    <div class="col-12">
      <button type="submit" class="btn btn-success">Save Changes</button>
      <a href="{{ url_for('passengers') }}" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
{% endblock %}

{% extends "base.html" %}
{% block content %}

<style>
  .btn-add {
    background-color: #008498;
    color: white;
    border: none;
  }
  .btn-add:hover {
    background-color: #006e7e;
  }

  .btn-edit {
    background-color: #fa824c;
    color: white;
    border: none;
  }
  .btn-edit:hover {
    background-color: #e46c36;
  }

  .btn-delete {
    background-color: #e23328;
    color: white;
    border: none;
  }
  .btn-delete:hover {
    background-color: #c5281f;
  }

  .table-header-green {
    background-color: #3d5f66 !important;
  }
  .table-header-green th {
    color: white !important;
    background-color: #3d5f66 !important;
  }
  body {
    margin-top: 6rem; /* מתאים ל-navbar fixed-top */
  }
</style>

<h2>Passengers</h2>

<!-- טופס הוספת נוסע -->
<form action="/add_passenger" method="POST" class="row g-3 mb-4">
  <div class="col-md-2">
    <input type="number" name="passengerID" class="form-control" placeholder="ID" required>
  </div>
  <div class="col-md-4">
    <input type="text" name="fullName" class="form-control" placeholder="Full Name" required>
  </div>
  <div class="col-md-4">
    <input type="email" name="email" class="form-control" placeholder="Email" required>
  </div>
  <div class="col-md-2">
    <button type="submit" class="btn btn-add w-100">Add Passenger</button>
  </div>
</form>

<!-- טבלה עם נוסעים קיימים -->
<table class="table table-bordered table-striped">
  <thead class="table-header-green">
    <tr>
      <th>ID</th>
      <th>Full Name</th>
      <th>Email</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody>
    {% for p in passengers %}
    <tr>
      <td>{{ p[0] }}</td>
      <td>{{ p[1] }}</td>
      <td>{{ p[2] }}</td>
      <td>
        <a href="{{ url_for('edit_passenger', passenger_id=p[0]) }}" class="btn btn-sm btn-edit">Edit</a>
        <a href="{{ url_for('delete_passenger', passenger_id=p[0]) }}" class="btn btn-sm btn-delete">Delete</a>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>

{% endblock %}

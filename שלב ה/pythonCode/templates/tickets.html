{% extends "base.html" %}
{% block content %}

<style>
  .btn-add {
    background-color: #008498;
    color: white;
    border: none;
  }
  .btn-add:hover {
    background-color: #006e7e;
  }

  .btn-edit {
    background-color: #fa824c;
    color: white;
    border: none;
  }
  .btn-edit:hover {
    background-color: #e46c36;
  }

  .btn-delete {
    background-color: #e23328;
    color: white;
    border: none;
  }
  .btn-delete:hover {
    background-color: #c5281f;
  }

  .table-header-green {
    background-color: #334b48 !important;
  }

  .table-header-green th {
    color: white !important;
    background-color: #334b48 !important;
  }
  body {
    margin-top: 6rem; /* מתאים ל-navbar fixed-top */
  }
</style>

<h2>Tickets</h2>

<!-- טופס הוספת כרטיס -->
<form action="/add_ticket" method="POST" class="row g-3 mb-4">
  <div class="col-md-3">
    <label class="form-label">Passenger</label>
    <select name="passengerID" class="form-select" required>
      {% for p in passengers %}
        <option value="{{ p[0] }}">{{ p[0] }} – {{ p[1] }}</option>
      {% endfor %}
    </select>
  </div>

  <div class="col-md-3">
    <label class="form-label">Seat</label>
    <select name="seatID" class="form-select" required>
      {% for s in seats %}
        <option value="{{ s[0] }}">Trip {{ s[2] }} – Seat #{{ s[1] }}</option>
      {% endfor %}
    </select>
  </div>

  <div class="col-md-2">
    <label class="form-label">Price</label>
    <input type="number" name="price" class="form-control" step="0.01" required>
  </div>

  <div class="col-md-2">
    <label class="form-label">Purchase Date</label>
    <input type="date" name="purchaseDate" class="form-control" required>
  </div>

  <div class="col-md-2 d-flex align-items-end">
    <button type="submit" class="btn btn-add w-100">Add Ticket</button>
  </div>
</form>

<!-- טבלה עם כרטיסים קיימים -->
<table class="table table-bordered table-striped">
  <thead class="table-header-green">
    <tr>
      <th>ID</th>
      <th>Passenger</th>
      <th>Seat</th>
      <th>Trip</th>
      <th>Price</th>
      <th>Purchase Date</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody>
    {% for t in tickets %}
    <tr>
      <td>{{ t[0] }}</td>
      <td>{{ t[1] }} – {{ t[2] }}</td>
      <td>{{ t[4] }}</td>
      <td>{{ t[5] }}</td>
      <td>{{ t[3] }}</td>
      <td>{{ t[6] }}</td>
      <td>
        <a href="{{ url_for('edit_ticket', ticket_id=t[0]) }}" class="btn btn-sm btn-edit">Edit</a>
        <a href="{{ url_for('delete_ticket', ticket_id=t[0]) }}" class="btn btn-sm btn-delete">Delete</a>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>

{% endblock %}
